name: Discover New Docling Projects

on:
  schedule:
    - cron: '0 12 * * 1'  # Weekly on Monday at noon UTC
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run discovery and update README
        id: discover
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/discover_and_update.py

      - name: Check if README was modified
        id: check
        run: |
          if git diff --quiet README.md; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes to README.md"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "README.md has been modified"
          fi

      - name: Create Pull Request
        if: steps.check.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            Add newly discovered Docling projects

            Co-Authored-By: Claude Sonnet 4.5 <noreply@anthropic.com>
          branch: auto/discover-projects-${{ github.run_number }}
          delete-branch: true
          title: '🆕 Add newly discovered Docling projects'
          body: |
            ## 🤖 Automated Project Discovery

            This PR automatically adds newly discovered Docling-related projects to the awesome list.

            ### 📋 What's included

            The discovery system found and categorized new projects based on:
            - GitHub topic: `docling`
            - Projects in `docling-project/*` organization
            - Minimum **5 stars**
            - Created in the last **90 days**
            - Not already in the README

            ### 🔍 Review Checklist

            Please verify:
            - [ ] All projects are relevant to the Docling ecosystem
            - [ ] Projects are in appropriate categories
            - [ ] No duplicate entries
            - [ ] Star counts and descriptions are accurate
            - [ ] Links work correctly

            ### ℹ️ Categories

            Projects are auto-categorized based on keywords:
            - **Official Ecosystem**: `docling-project/*` repos
            - **Framework Integrations**: langchain, llamaindex, haystack, crewai mentions
            - **Community Tools**:
              - UI/Visualizer: streamlit, gradio, ui, visualizer
              - RAG Systems: rag, retrieval, vector
              - OCR Plugins: ocr
              - Other: everything else

            ---

            🤖 Generated by [Project Discovery workflow](.github/workflows/discover-projects.yml)

            📅 Discovery date: ${{ github.run_id }}
          labels: |
            automated
            enhancement
            new-projects
          assignees: ${{ github.repository_owner }}
